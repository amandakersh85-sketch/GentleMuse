<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Lora';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Lora-Regular.ttf');font-weight:400}
@font-face{font-family:'Lora';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Lora-Bold.ttf');font-weight:700}
@font-face{font-family:'Lora';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Lora-Italic.ttf');font-style:italic}
@font-face{font-family:'Gloock';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Gloock-Regular.ttf')}
@font-face{font-family:'Jura';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Jura-Light.ttf');font-weight:300}
@font-face{font-family:'Jura';src:url('file:///mnt/skills/examples/canvas-design/canvas-fonts/Jura-Medium.ttf');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#EAEAE6}html,body{width:1080px;height:1350px}
body{background:linear-gradient(178deg,#F4F4F2 0%,#EAEAE6 100%);color:#262626;font-family:'Lora',serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.p{position:absolute;inset:34px;border:1px solid #D5D5CE;padding:70px 74px;display:flex;flex-direction:column}
.tag{font-family:'Jura';font-weight:500;letter-spacing:.36em;font-size:17px;text-transform:uppercase;color:#6E6E6E}
.acc{height:2px;background:#3F5E52;width:56px;margin-top:22px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.hook{font-weight:700;font-size:72px;line-height:1.14}
.hook em{font-style:italic;font-weight:400}
.body{font-size:46px;line-height:1.38}
.step{font-family:'Gloock';color:#3F5E52;font-size:70px;line-height:1;margin-bottom:26px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.sig{font-style:italic;font-size:24px}
.pg{font-family:'Jura';font-weight:300;letter-spacing:.24em;color:#6E6E6E;font-size:15px}
.cta{font-weight:700;font-size:60px;line-height:1.2}
.cta span{color:#3F5E52}
.sub{font-size:30px;line-height:1.4;color:#6E6E6E;margin-top:28px}
</style></head><body><div class="p">
<div class="tag">THE GUIDE</div><div class="acc"></div>
<div class="mid"><div class="step">3</div><div class="body">I had a shift to work, 1 income, and no idea what an automation was.</div></div>
<div class="foot"><div class="pg">4 / 6</div><div class="sig">The Gentle Muse</div></div>
</div></body></html>
